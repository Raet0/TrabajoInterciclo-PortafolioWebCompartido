<div class="drawer">
  <input id="my-drawer-2" type="checkbox" class="drawer-toggle" />
  <div class="drawer-content flex flex-col">
    <div class="navbar bg-base-300 w-full">
      <div class="flex-none lg:hidden">
        <label for="my-drawer-2" aria-label="open sidebar" class="btn btn-square btn-ghost">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            class="inline-block h-6 w-6 stroke-current">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </label>
      </div>
      <div class="mx-2 flex-1 px-2 font-bold"></div>
      <div class="hidden flex-none lg:block">
        <ul class="menu menu-horizontal">
          <!-- boton para volver al inicio -->
          <li><a  class="bg-black hover:bg-gray-700 text-white font-bold py-2 px-4 rounded" routerLink="" routerLinkActive="bg-primary text-primary-content  "
              [routerLinkActiveOptions]="{ exact:true}">Home</a></li>
        </ul>
        <!-- boton de inicio/registro -->
        <a class="bg-black hover:bg-gray-700 text-white font-bold py-2 px-4 rounded" routerLink="/login"
          routerLinkActive="bg-primary text-primary-content" [routerLinkActiveOptions]="{exact:true}">Login</a>
        <!-- Botón de cambio de tema -->
        <app-theme-switcher></app-theme-switcher>
      </div>
    </div>
  </div>
  <!-- phone version -->
  <div class="drawer-side">
    <label for="my-drawer-2" aria-label="close sidebar" class="drawer-overlay"></label>
    <ul class="menu bg-base-200 min-h-full w-80 p-4">
      <button class="hover:text-gray-500 transition " (click)="scrollToHome()">About</button>
      <button class="hover:text-gray-500 transition " (click)="scrollToPerfiles()">Experience</button>
      <button class="hover:text-gray-500 transition " (click)="scrollToPerfiles()">Projects</button>
      <button class="hover:text-gray-500 transition " (click)="scrollToPerfiles()">Contact</button>
      <!-- <li><a routerLink="" routerLinkActive="bg-primary text-primary-content" [routerLinkActiveOptions]="{ exact:true}">Inicio</a></li>
      <li><a routerLink="/estilos" routerLinkActive="bg-primary text-primary-content" [routerLinkActiveOptions]="{ exact:true}">Estilos</a></li>
      <li><a routerLink="/simpsons-page" routerLinkActive="bg-primary text-primary-content" [routerLinkActiveOptions]="{ exact:true}">Simpsons</a></li> -->
    </ul>
    <!-- Theme switcher al pie del menú -->
    <div class="p-4 border-t border-base-300">
      <app-theme-switcher></app-theme-switcher>
    </div>
  </div>
</div>
