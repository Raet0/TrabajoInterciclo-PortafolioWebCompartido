<div class="flex justify-center items-center min-h-screen bg-[#e0e5ec] text-[#4a4a4a] font-sans">

  <div
    class="bg-[#e0e5ec] p-12 rounded-[40px] w-full max-w-[400px] text-center shadow-[14px_14px_28px_#a3b1c6,-14px_-14px_28px_#ffffff]">

    <h2 class="text-3xl font-bold mb-8 text-gray-700">Register</h2>

    <div class="mb-5">
      <input
        class="w-full p-4 border-none rounded-[50px] bg-[#e0e5ec] outline-none text-sm placeholder-gray-500 shadow-[inset_6px_6px_10px_#a3b1c6,inset_-6px_-6px_10px_#ffffff]"
        type="text" placeholder="Full Name">
    </div>

    <div class="mb-8">
      <input
        class="w-full p-4 border-none rounded-[50px] bg-[#e0e5ec] outline-none text-sm placeholder-gray-500 shadow-[inset_6px_6px_10px_#a3b1c6,inset_-6px_-6px_10px_#ffffff]"
        type="email" placeholder="Email Address">
    </div>

    <div class="mb-8">
      <input
        class="w-full p-4 border-none rounded-[50px] bg-[#e0e5ec] outline-none text-sm placeholder-gray-500 shadow-[inset_6px_6px_10px_#a3b1c6,inset_-6px_-6px_10px_#ffffff]"
        type="password" placeholder="Password">
    </div>

    <button
      class="w-full py-4 mb-8 rounded-[50px] bg-[#e0e5ec] text-[#4a4a4a] font-bold tracking-wide uppercase shadow-[6px_6px_10px_#a3b1c6,-6px_-6px_10px_#ffffff] hover:shadow-[4px_4px_8px_#a3b1c6,-4px_-4px_8px_#ffffff] active:shadow-[inset_4px_4px_8px_#a3b1c6,inset_-4px_-4px_8px_#ffffff] active:translate-y-[2px] transition-all cursor-pointer">
      Sign Up
    </button>

    <div class="text-sm text-gray-600">
      <p class="inline">Already a member? </p>
      <a class="font-bold text-blue-500 hover:text-blue-600 cursor-pointer no-underline" routerLink="login">
        Sign in
      </a>
    </div>

  </div>
</div>
