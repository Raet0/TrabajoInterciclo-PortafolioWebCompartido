<app-drawer></app-drawer>
<div class="container mt-5 mb-5">
  <div class="card shadow">

    <div class="card-body" *ngIf="currentUser; else loading">

      <div class="row">

        <div class="col-md-4 text-center mb-4">
          <div class="profile-img-container mb-3">
            <img
              [src]="photoPreview || 'assets/default-avatar.png'"
              alt="Foto de perfil"
              class="img-thumbnail rounded-circle profile-picture"
            />
          </div>

          <div *ngIf="isEditing">
            <label
              for="photoInput"
              class="btn btn-sm btn-outline-primary cursor-pointer"
            >
              Cambiar foto
            </label>
            <input
              type="file"
              id="photoInput"
              accept="image/*"
              (change)="onFileSelected($event)"
              hidden
            />
          </div>
        </div>

        <div class="col-md-8">

          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="card-title mb-0">Mi perfil</h3>

            <button
              type="button"
              class="btn btn-sm"
              [ngClass]="isEditing ? 'btn-outline-danger' : 'btn-outline-secondary'"
              (click)="toggleEdit()"
            >
              {{ isEditing ? 'Cancelar' : 'Editar perfil' }}
            </button>
          </div>

          <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">

            <div class="mb-3">
              <label class="form-label fw-bold">Rol:</label>
              <span class="badge bg-info text-dark">
                {{ currentUser.role }}
              </span>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Correo electrónico:</label>
              <p class="mb-0">{{ currentUser.email }}</p>
            </div>

            <div class="mb-3">
              <label for="displayName" class="form-label fw-bold">
                Nombre de usuario:
              </label>

              <div *ngIf="!isEditing">
                <p class="fs-5 mb-0">{{ currentUser.displayName }}</p>
              </div>

              <div *ngIf="isEditing">
                <input
                  id="displayName"
                  type="text"
                  class="form-control"
                  formControlName="displayName"
                  [ngClass]="{
                    'is-invalid':
                      profileForm.get('displayName')?.invalid &&
                      profileForm.get('displayName')?.touched
                  }"
                />

                <div
                  class="invalid-feedback"
                  *ngIf="profileForm.get('displayName')?.hasError('required')"
                >
                  El nombre es obligatorio.
                </div>

                <div
                  class="invalid-feedback"
                  *ngIf="profileForm.get('displayName')?.hasError('minlength')"
                >
                  Debe tener al menos 3 caracteres.
                </div>
              </div>
            </div>

            <div class="mt-4" *ngIf="isEditing">
              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="profileForm.invalid"
              >
                Guardar cambios
              </button>
            </div>

          </form>

        </div>
      </div>
    </div>

    <ng-template #loading>
      <div class="card-body text-center">
        <p>Cargando perfil...</p>
      </div>
    </ng-template>

  </div>
</div>
