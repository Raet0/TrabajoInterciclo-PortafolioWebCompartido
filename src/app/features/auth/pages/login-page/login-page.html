<main>
  <app-drawer></app-drawer>
  <div class="flex justify-center items-center min-h-screen bg-base-200 font-sans transition-colors duration-300">
    
    <div class="card bg-base-100 p-12 rounded-[40px] w-full max-w-[400px] text-center shadow-xl">

      <h2 class="text-3xl font-bold mb-8 text-base-content">Login Form</h2>

      <div class="mb-5">
        <input
          class="input w-full p-4 rounded-[50px] bg-base-200 text-base-content placeholder-base-content/50 focus:outline-none focus:ring-2 focus:ring-primary transition-all border-none"
          type="email" 
          placeholder="Email or Phone">
      </div>

      <div class="mb-8">
        <input
          class="input w-full p-4 rounded-[50px] bg-base-200 text-base-content placeholder-base-content/50 focus:outline-none focus:ring-2 focus:ring-primary transition-all border-none"
          type="password" 
          placeholder="Password">
      </div>

      <button
        class="btn w-full py-4 mb-8 rounded-[50px] bg-base-300 text-base-content font-bold tracking-wide uppercase hover:bg-base-content hover:text-base-100 border-none shadow-lg transition-all cursor-pointer h-auto min-h-[3rem]">
        Sign in
      </button>

      <div class="text-sm text-base-content/70">
        <p class="inline">Not a member? </p>
        <a routerLink="/register" class="link link-primary font-bold no-underline hover:text-primary-focus cursor-pointer">
          Signup now
        </a>
      </div>

    </div>
  </div>
</main>
