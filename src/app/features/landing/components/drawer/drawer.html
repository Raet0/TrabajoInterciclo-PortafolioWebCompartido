<div class="drawer">
  <input id="my-drawer-2" type="checkbox" class="drawer-toggle" />
  <div class="drawer-content flex flex-col">
    <div class="navbar bg-base-300 w-full">
      <div class="flex-none lg:hidden">
        <label for="my-drawer-2" aria-label="open sidebar" class="btn btn-square btn-ghost">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            class="inline-block h-6 w-6 stroke-current">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </label>
      </div>

      <!-- Logo/Brand en el centro-izquierda -->
      <div class="mx-2 flex-1 px-2 font-bold">Dev-Solutions</div>

      <!-- Menú Desktop (versión oculta en móvil) -->
      <div class="hidden flex-none lg:block">
        <ul class="menu menu-horizontal gap-2">
          <li>
            <button class="btn btn-ghost" (click)="scrollToHome()">
              Profiles
            </button>
          </li>
          <li>
            <button class="btn btn-ghost" (click)="scrollToProjects()">
              Projects
            </button>
          </li>
          <li>
            <button class="btn btn-ghost" (click)="scrollToContact()">
              Contact
            </button>
          </li>
        </ul>
      </div>

      <!-- Botón Login y Theme Switcher (lado derecho) -->
      <div class="flex-none gap-2">
        <a class="btn btn-ghost" routerLink="/login"
          routerLinkActive="bg-primary text-primary-content" [routerLinkActiveOptions]="{exact:true}">
          Login
        </a>
        <app-theme-switcher></app-theme-switcher>
      </div>
    </div>
  </div>

  <!-- Menú móvil (phone version) -->
  <div class="drawer-side">
    <label for="my-drawer-2" aria-label="close sidebar" class="drawer-overlay"></label>
    <ul class="menu bg-base-200 min-h-full w-80 p-4">
      <li>
        <button (click)="scrollToHome()">Profiles</button>
      </li>
      <li>
        <button (click)="scrollToProjects()">Projects</button>
      </li>
      <li>
        <button (click)="scrollToContact()">Contact</button>
      </li>
      <li>
        <a routerLink="/login">Login</a>
      </li>
    </ul>
    <!-- Theme switcher al pie del menú -->
    <div class="p-4 border-t border-base-300">
      <app-theme-switcher></app-theme-switcher>
    </div>
  </div>
</div>
